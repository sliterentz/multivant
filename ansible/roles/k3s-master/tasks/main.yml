---
- name: Set K3s master node arguments
  ansible.builtin.set_fact:
    k3s_master_exec_args: >-
      server
      --node-ip={{ master_ip }}
      --flannel-iface=enp0s8
      --bind-address={{ master_ip }}
      --advertise-address={{ master_ip }}
      --tls-san={{ master_ip }}
      --disable-cloud-controller

- name: Install K3s master node
  ansible.builtin.shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_EXEC="{{ k3s_master_exec_args }}"
    sh -
  args:
    creates: /usr/local/bin/k3s
  changed_when: true

- name: Wait for K3s to be ready
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 15

- name: Change kubeconfig permissions
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Read the K3s node token from the master
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  changed_when: false

- name: Store K3s node token for worker nodes
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.stdout }}"
    cacheable: yes

- name: Create shared directory for kubeconfig
  ansible.builtin.file:
    path: "/vagrant/shared/{{ cluster_name }}"
    state: directory
    mode: '0755'
  when: k3s_token_raw.stdout is defined

- name: Copy kubeconfig to shared location
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/vagrant/shared/{{ cluster_name }}/kubeconfig"
    remote_src: yes
    owner: vagrant
    group: vagrant
    mode: '0644'
  when: k3s_token_raw.stdout is defined

- name: Replace localhost with master IP in kubeconfig
  ansible.builtin.lineinfile:
    path: "/vagrant/shared/{{ cluster_name }}/kubeconfig"
    regexp: '    server: https://127.0.0.1:6443'
    line: '    server: https://{{ master_ip }}:6443'
  when: k3s_token_raw.stdout is defined

- name: Fetch kubeconfig to local shared directory
  ansible.builtin.fetch:
    src: "/vagrant/shared/{{ cluster_name }}/kubeconfig"
    dest: "shared/{{ cluster_name }}/kubeconfig"
    flat: yes
  when: k3s_token_raw.stdout is defined

- name: Set master_ip fact for other hosts
  ansible.builtin.set_fact:
    master_ip: "{{ master_ip }}"
    cacheable: yes
  when: k3s_token_raw.stdout is defined
