---
- name: Provision all nodes (Common Setup)
  hosts: all
  become: yes
  roles:
    - common

- name: Provision K3s Master Nodes (Control Plane)
  hosts: masters
  become: yes
  roles:
    - role: k3s-master
      vars:
        cluster_name: "{{ 'blue' if inventory_hostname in groups['blue_workers'] else 'green' }}"
      tags: [control_plane]

- name: Provision K3s Worker Nodes (Data Plane)
  hosts: workers
  become: yes
  roles:
    - role: k3s-worker
      vars:
        master_ip: "{{ hostvars[groups[cluster_name + '_masters'][0]]['ansible_host'] }}"
        cluster_name: "{{ 'blue' if inventory_hostname in groups['blue_workers'] else 'green' }}"    
      tags: [data_plane]

- name: Provision Platform Tooling on Masters
  hosts: masters
  become: yes
  roles:
    - role: build-plane
      tags: [build_plane]
    - role: observability
      tags: [observability_plane]
    # - role: identity-plane
    #   tags: [identity_plane]